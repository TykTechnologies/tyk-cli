    - profile: known_issue_reproducer
      requirement: SYS-REQ-019
      status: pass
      observed_result: known_issue_reproduced
      known_issues:
          - 5xx-no-client-retry
      input_set:
          - 5xx-no-client-retry source review
          - internal/client/client.go:doRequest
          - internal/client/client.go:handleResponse
          - internal/cli/errors.go:isServerError
          - internal/cli/errors.go:classifyDashboardError
          - internal/cli/exit_codes_test.go:TestAPIList_ServerErrorReturnsExit8
      summary: >
          internal/client/client.go issues a single HTTP request per Dashboard call
          with no retry loop or exponential backoff. When the Dashboard responds
          5xx, isServerError classifies the error and classifyDashboardError
          maps it to ExitError{Code: 8} (SYS-REQ-019), but the CLI aborts
          immediately — no retry attempt is made. TestAPIList_ServerErrorReturnsExit8
          verifies exit-code mapping only; there is no test that would fail if
          retry were added, which is intentional per the KI documentation.
