      known_issues:
          - rate-limit-no-client-backoff
      input_set:
          - rate-limit-no-client-backoff source review
          - internal/client/client.go:doRequest
          - internal/cli/errors.go:isRateLimitError
          - internal/cli/errors.go:classifyDashboardError
          - internal/cli/exit_codes_test.go:TestAPIList_RateLimitedReturnsExit7
      summary: >
          internal/client/client.go does not read the Retry-After header on
          HTTP 429 responses and does not sleep before returning. isRateLimitError
          identifies the class and classifyDashboardError maps 429 to
          ExitError{Code: 7} (SYS-REQ-018), but there is no cool-down or
          adaptive back-pressure in the client. Operators must throttle CLI
          invocations externally. TestAPIList_RateLimitedReturnsExit7 verifies
          exit-code mapping only.
