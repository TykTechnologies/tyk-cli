id: rate-limit-no-client-backoff
title: HTTP client does not implement backoff or honour Retry-After on 429 responses
description: internal/client/client.go does not parse the Retry-After header on HTTP 429 responses and does not implement exponential backoff. REQ-API-025/POL-025 only specify the exit-code mapping for 429; they do not require automatic retry. Heavy CI usage that triggers rate limits aborts immediately rather than waiting for the suggested cool-down window.
affected_requirements:
    - REQ-API-030
mitigation: Operators throttle CLI invocations in CI scripts. The 'back off and retry' hint in the exit-7 error message tells the user what to do.
customer_impact: CI loops that issue many CLI calls fail fast on rate-limit instead of pacing themselves; operators must implement backoff externally (e.g. sleep between invocations).
