project_id: oas-versioning
title: "OAS Versioning CLI Commands"
description: "Implement version management commands for OAS APIs in Tyk CLI"
validation:
  status: approved

phases:
  - id: "01"
    name: "Foundation"
    description: "Error helpers, OAS versioning metadata extraction, and new client method"
    steps:
      - step_id: "01-01"
        description: "Create version-aware error helpers in internal/cli/version_errors.go"
        acceptance_criteria:
          - "versionNotFoundError returns ExitError code 3 with available versions list"
          - "versionConflictError returns ExitError code 4 with apply suggestion"
          - "apiNotFoundError returns ExitError code 3 with 'tyk api list' suggestion"
          - "All helpers accept apiID and return *ExitError"
        files_to_modify:
          - internal/cli/version_errors.go
          - internal/cli/version_errors_test.go

      - step_id: "01-02"
        description: "Add ExtractVersioningMetadata to internal/oas/transform.go"
        acceptance_criteria:
          - "ExtractVersioningMetadata returns VersioningMetadata struct with BaseAPIID, VersionName, SetDefault, IsVersionFile"
          - "Returns IsVersionFile:false when no versioning section exists"
          - "Returns populated struct when x-tyk-api-gateway.info.versioning exists"
        files_to_modify:
          - internal/oas/transform.go
          - internal/oas/transform_test.go

      - step_id: "01-03"
        description: "Add CreateOASAPIVersion client method"
        acceptance_criteria:
          - "CreateOASAPIVersion POSTs to /api/apis/oas with base_api_id and new_version_name query params"
          - "Returns API response on success"
          - "Passes through error responses from Dashboard"
        files_to_modify:
          - internal/client/client.go
          - internal/client/client_test.go

  - id: "02"
    name: "Version Commands"
    description: "Replace placeholder commands with real implementations"
    steps:
      - step_id: "02-01"
        description: "Implement tyk api versions list command"
        acceptance_criteria:
          - "Command calls ListOASAPIVersions and displays version table on stderr"
          - "Shows default version marker and count summary"
          - "--json outputs structured JSON to stdout with api_id, default, versions"
          - "API not found returns exit code 3 with helpful message"
        files_to_modify:
          - internal/cli/api.go
          - internal/cli/api_versions_test.go

      - step_id: "02-02"
        description: "Implement tyk api versions switch-default command"
        acceptance_criteria:
          - "Command calls ListOASAPIVersions for validation, then SwitchDefaultVersion"
          - "Shows previous and new default in human output"
          - "No-op with informational message when target is already default"
          - "Version not found returns exit 3 with available versions"
          - "--json outputs structured JSON with action, previous_default, new_default"
        files_to_modify:
          - internal/cli/api.go
          - internal/cli/api_versions_test.go

      - step_id: "02-03"
        description: "Implement tyk api versions create command"
        acceptance_criteria:
          - "Command loads OAS file, checks for version conflict, creates version via CreateOASAPIVersion"
          - "--set-default flag sets new version as default"
          - "Duplicate version name returns exit code 4 with conflict message"
          - "Human output includes switch-default hint when not set as default"
          - "--json outputs structured JSON with action, api_id, version_name, is_default"
        files_to_modify:
          - internal/cli/api.go
          - internal/cli/api_versions_test.go

  - id: "03"
    name: "Apply Integration"
    description: "Extend batch apply to handle version files"
    steps:
      - step_id: "03-01"
        description: "Extend classifyContent, sortFiles, and apply for version files in batch apply"
        acceptance_criteria:
          - "classifyContent detects x-tyk-api-gateway.info.versioning and returns configFileAPIVersion"
          - "sortFiles orders: policies first, base APIs second, version files third"
          - "applyFileWithOp handles configFileAPIVersion by calling CreateOASAPIVersion"
          - "dryRunFile reports 'would create version' for version files"
          - "JSON output includes version_name field for version operations"
        files_to_modify:
          - internal/cli/apply.go
          - test/apply_version_integration_test.go
