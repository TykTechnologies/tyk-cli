roadmap:
  project_id: policies-mgmt
  created_at: '2026-02-18T12:33:49Z'
  total_steps: 8
  phases: 3
phases:
- id: '01'
  name: 'Foundation: Types, Client, and Policy Logic'
  steps:
  - id: 01-01
    name: 'Policy types and wire format definitions'
    description: >
      Define CLI schema types (PolicyFile, PolicyMetadata, PolicySpec, AccessEntry),
      Dashboard wire types (DashboardPolicy, AccessRight, DashboardPolicyListResponse),
      and validation error types. Duration fields accept both string and integer YAML input.
    criteria:
      - 'PolicyFile round-trips through YAML marshal/unmarshal preserving all fields'
      - 'DashboardPolicy round-trips through JSON marshal/unmarshal preserving all fields including access_rights map'
      - 'Duration fields unmarshal from both string "30d" and integer 60 representations'
      - 'AccessEntry struct supports exactly one selector field (id, name, listenPath, or tags)'
    time_estimate: '2h'
    dependencies: []
    implementation_scope:
      production_files:
        - 'pkg/types/policy.go'
      test_files:
        - 'pkg/types/policy_test.go'
  - id: 01-02
    name: 'Policy client CRUD methods'
    description: >
      Add ListPolicies, GetPolicy, CreatePolicy, UpdatePolicy, DeletePolicy methods
      to the existing Client struct. Uses doRequest/handleResponse pattern from client.go.
      Dashboard endpoints at /api/portal/policies with standard auth headers.
    criteria:
      - 'ListPolicies sends GET /api/portal/policies?p={page} and parses paginated response with Data array'
      - 'GetPolicy returns single policy by ID; returns structured ErrorResponse on 404'
      - 'CreatePolicy sends POST with JSON wire-format body and parses created policy response'
      - 'UpdatePolicy sends PUT to /api/portal/policies/{id} with JSON wire-format body'
      - 'DeletePolicy sends DELETE to /api/portal/policies/{id}; returns structured ErrorResponse on 404'
    time_estimate: '3h'
    dependencies:
      - '01-01'
    implementation_scope:
      production_files:
        - 'internal/client/policy.go'
      test_files:
        - 'internal/client/policy_test.go'
  - id: 01-03
    name: 'Duration parser, schema validator, and selector resolver'
    description: >
      Implement duration parsing (s/m/h/d suffixes and plain integers to seconds),
      schema validation (required fields, types, selector format, duration format),
      selector resolution (name/listenPath/id/tags to API IDs with fuzzy suggestions),
      and bidirectional CLI-to-wire conversion. All pure logic, no HTTP dependency.
    criteria:
      - 'ParseDuration converts "30d" to 2592000, "1h" to 3600, "60" to 60, "0" to 0; rejects "abc", negative, fractional, and mixed units'
      - 'FormatDuration converts seconds to largest clean unit: 86400 to "1d", 3600 to "1h", 90 to "90s"'
      - 'ValidatePolicy collects all errors (missing metadata.id, invalid duration, zero/multiple selectors) with field paths before returning'
      - 'Name/listenPath/id selectors resolve to exactly one API or fail; tags resolve to >= 1 API or fail; zero-match returns top 3 fuzzy suggestions'
      - 'CLIToWire and WireToCLI convert all fields per data model spec; round-trip produces equivalent content'
    time_estimate: '5h'
    dependencies:
      - '01-01'
    implementation_scope:
      production_files:
        - 'internal/policy/duration.go'
        - 'internal/policy/validate.go'
        - 'internal/policy/selector.go'
        - 'internal/policy/convert.go'
      test_files:
        - 'internal/policy/duration_test.go'
        - 'internal/policy/validate_test.go'
        - 'internal/policy/selector_test.go'
        - 'internal/policy/convert_test.go'
- id: '02'
  name: 'CLI Commands: list, get, apply, delete'
  steps:
  - id: 02-01
    name: 'Policy list command and root registration'
    description: >
      Create NewPolicyCommand() cobra tree with "list" subcommand displaying
      paginated table (ID, Name, APIs count, Tags). Register in root.go.
      Follows api.go output convention: stderr for human messages, stdout for data.
    criteria:
      - '`tyk policy list` displays table with ID, Name, APIs count, Tags columns; empty inventory shows "No policies found"'
      - '`tyk policy list --json` outputs JSON with policies array, page, and count to stdout'
      - '`tyk policy --help` shows all subcommands; `tyk --help` lists policy alongside api and config'
      - 'Network error returns exit code 1 with message to stderr'
    time_estimate: '3h'
    dependencies:
      - '01-02'
    implementation_scope:
      production_files:
        - 'internal/cli/policy.go'
        - 'internal/cli/root.go'
      test_files:
        - 'internal/cli/policy_test.go'
  - id: 02-02
    name: 'Policy get command'
    description: >
      Add "get" subcommand to policy command tree. Fetches policy by ID, converts
      wire format to CLI schema via WireToCLI (reverse-resolving API IDs to names),
      outputs YAML to stdout and summary to stderr.
    criteria:
      - '`tyk policy get <id>` prints summary to stderr and CLI schema YAML to stdout with durations in human format'
      - '`tyk policy get <id> --json` outputs CLI schema as JSON to stdout'
      - 'Non-existent policy ID returns exit code 3 with "policy not found" message'
      - 'Wire-to-CLI conversion reverse-resolves API IDs to name selectors; unresolvable IDs fall back to id selector'
    time_estimate: '2h'
    dependencies:
      - '02-01'
    implementation_scope:
      production_files:
        - 'internal/cli/policy.go'
      test_files:
        - 'internal/cli/policy_test.go'
  - id: 02-03
    name: 'Policy apply command'
    description: >
      Add "apply" subcommand with -f flag (file or stdin). Pipeline: load YAML,
      validate schema, resolve selectors against live API list, parse durations,
      convert to wire format, upsert (create if new, update if exists).
    criteria:
      - '`tyk policy apply -f policy.yaml` creates new policy when ID not found on server; updates when ID exists (idempotent upsert)'
      - 'Selectors resolve against live API list: name, listenPath, id each to exactly one API; tags expand to all matching APIs'
      - 'Validation errors (missing fields, invalid duration, bad selector format) return exit code 2 with all errors listed'
      - 'Selector resolution errors (not found, ambiguous) return exit code 2 with suggestions or candidate list'
      - '`tyk policy apply -f -` reads policy YAML from stdin'
    time_estimate: '4h'
    dependencies:
      - '02-01'
      - '01-03'
    implementation_scope:
      production_files:
        - 'internal/cli/policy.go'
      test_files:
        - 'internal/cli/policy_test.go'
  - id: 02-04
    name: 'Policy delete command'
    description: >
      Add "delete" subcommand requiring policy ID. Fetches policy to verify existence
      and show name in confirmation prompt. Requires --yes flag or interactive confirmation.
    criteria:
      - '`tyk policy delete <id> --yes` deletes without prompting and prints confirmation to stderr'
      - 'Interactive delete prompts with policy name; "n" cancels with exit code 0'
      - 'Non-existent policy ID returns exit code 3 with "policy not found" message'
      - '`tyk policy delete <id> --yes --json` outputs structured JSON result to stdout'
    time_estimate: '2h'
    dependencies:
      - '02-01'
    implementation_scope:
      production_files:
        - 'internal/cli/policy.go'
      test_files:
        - 'internal/cli/policy_test.go'
- id: '03'
  name: 'Integration: init scaffold and end-to-end validation'
  steps:
  - id: 03-01
    name: 'Policy init scaffold and integration testing'
    description: >
      Add "init" subcommand that prompts for policy ID and name, generates scaffold
      YAML with defaults and comments, writes to policies/{id}.yaml. No Dashboard
      connectivity required. Run full integration test suite across all commands.
    criteria:
      - '`tyk policy init` prompts for ID and name, writes scaffold YAML to policies/{id}.yaml with valid schema'
      - 'Init warns and exits without overwriting when target file already exists'
      - 'Init works offline with no Dashboard connectivity required'
      - 'Scaffold output is valid YAML that passes schema validation and can be applied after filling access entries'
      - 'Full walking skeleton passes: list empty, apply new policy, list shows policy, get returns CLI schema, delete removes it'
    time_estimate: '3h'
    dependencies:
      - '02-03'
      - '02-04'
    implementation_scope:
      production_files:
        - 'internal/cli/policy.go'
      test_files:
        - 'internal/cli/policy_test.go'
implementation_scope:
  source_directories:
  - pkg/types/
  - internal/client/
  - internal/policy/
  - internal/cli/
  test_directories:
  - pkg/types/
  - internal/client/
  - internal/policy/
  - internal/cli/
  excluded_patterns:
  - vendor/**
  - cmd/**
validation:
  status: pending
  reviewer: atlas
  approved_at: null
