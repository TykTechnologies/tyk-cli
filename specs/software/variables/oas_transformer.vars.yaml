component: oas_transformer
variables:
    # --- transform.go / GenerateListenPath (SW-REQ-020..022) ----------------
    - name: listen_path_generated
      type: bool
      direction: input
      description: whether GenerateListenPath was called with any non-nil title
    - name: result_has_slash_prefix_and_suffix
      type: bool
      direction: output
      description: whether the returned listen path starts with '/' and ends with '/'
    - name: title_has_non_alphanumeric_chars
      type: bool
      direction: input
      description: whether the input title contains characters outside [a-z0-9]
    - name: result_collapses_non_alphanumeric_to_hyphen
      type: bool
      direction: output
      description: whether every run of non-alphanumeric characters became a single '-' in the slug
    - name: title_sanitises_to_empty
      type: bool
      direction: input
      description: whether stripping all non-alphanumeric characters and trim leaves an empty slug
    - name: result_uses_api_fallback
      type: bool
      direction: output
      description: whether the listen path is exactly '/api/' (the documented fallback)

    # --- Variables refined from parent SYS-REQ (cross-level coverage) ------
    - name: listen_path_valid
      type: bool
      direction: output
      description: refines SYS-REQ-010 — whether the generated listen path is a non-empty URL-safe string starting and ending with /
