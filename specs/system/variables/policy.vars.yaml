component: policy
variables:
    # --- Contract variables (REQ-POL-010/011) ---------------------------------
    - name: valid_duration_string
      type: bool
      direction: input
      description: whether the input string is a valid duration (e.g. 30d, 1h)
    - name: duration_positive
      type: bool
      direction: output
      description: whether the resolved duration in seconds is a positive integer
    - name: ambiguous_selector
      type: bool
      direction: input
      description: whether the API selector matches zero or more than one API
    - name: resolve_error_returned
      type: bool
      direction: output
      description: whether an error is returned for an ambiguous or missing selector

    # --- REQ-POL-001: list pagination default ---------------------------------
    - name: policy_page_flag_omitted
      type: bool
      direction: input
      description: whether the --page flag was absent from the policy-list invocation
    - name: policy_page_equals_one
      type: bool
      direction: output
      description: whether the Dashboard request used page=1

    # --- REQ-POL-002: --json toggles output format ---------------------------
    - name: json_flag_set
      type: bool
      direction: input
      description: whether --json was passed to policy-get
    - name: output_is_json
      type: bool
      direction: output
      description: whether the stdout payload was emitted as JSON (rather than CLI-schema YAML)

    # --- REQ-POL-003: apply idempotent upsert --------------------------------
    - name: policy_apply_invoked
      type: bool
      direction: input
      description: whether policy apply was the active runner
    - name: policy_target_exists
      type: bool
      direction: input
      description: whether the Dashboard already contains a policy with the friendly ID
    - name: policy_apply_takes_update_path
      type: bool
      direction: output
      description: whether apply called UpdatePolicy rather than CreatePolicy

    # --- REQ-POL-004: delete precondition ------------------------------------
    - name: policy_delete_invoked
      type: bool
      direction: input
      description: whether policy delete was the active runner
    - name: policy_delete_target_does_not_exist
      type: bool
      direction: input
      description: whether the Dashboard preflight returned 404 for the target policy

    # --- REQ-POL-005: init preconditions --------------------------------------
    - name: policy_init_invoked
      type: bool
      direction: input
      description: whether policy init was the active runner
    - name: policy_init_target_file_exists
      type: bool
      direction: input
      description: whether the target output file path already exists on disk

    # --- REQ-POL-006: validation before HTTP ---------------------------------
    - name: yaml_validation_failed
      type: bool
      direction: input
      description: whether the policy YAML failed ValidatePolicy before any HTTP call
    - name: no_dashboard_request_sent
      type: bool
      direction: output
      description: whether the runner aborted before issuing any Dashboard request

    # --- REQ-POL-007: bidirectional conversion preserves fields --------------
    - name: valid_cli_policy_input
      type: bool
      direction: input
      description: whether the input PolicyFile passed validation
    - name: wire_roundtrip_preserves_fields
      type: bool
      direction: output
      description: whether CLIToWire followed by WireToCLI returns a PolicyFile equal to the original

    # --- REQ-POL-024/025/026: error class to exit-code mapping --------------
    - name: policy_auth_failed_response
      type: bool
      direction: input
      description: whether the Dashboard responded with HTTP 401 to a policy subcommand
    - name: policy_forbidden_response
      type: bool
      direction: input
      description: whether the Dashboard responded with HTTP 403 to a policy subcommand
    - name: policy_rate_limited_response
      type: bool
      direction: input
      description: whether the Dashboard responded with HTTP 429 to a policy subcommand
    - name: policy_server_error_response
      type: bool
      direction: input
      description: whether the Dashboard responded with HTTP 5xx to a policy subcommand
    - name: policy_exit_auth_failed
      type: bool
      direction: output
      description: whether the policy subcommand terminated with exit code 5 (ExitAuthFailed)
    - name: policy_exit_forbidden
      type: bool
      direction: output
      description: whether the policy subcommand terminated with exit code 6 (ExitForbidden)
    - name: policy_exit_rate_limited
      type: bool
      direction: output
      description: whether the policy subcommand terminated with exit code 7 (ExitRateLimited)
    - name: policy_exit_server_error
      type: bool
      direction: output
      description: whether the policy subcommand terminated with exit code 8 (ExitServerError)

    # --- Exit-code variables (REQ-POL-020..023) ------------------------------
    - name: policy_operation_succeeded
      type: bool
      direction: input
      description: whether a policy subcommand completed without error
    - name: policy_invalid_args
      type: bool
      direction: input
      description: whether a policy subcommand was invoked with invalid or missing required flags
    - name: policy_target_not_found
      type: bool
      direction: input
      description: whether the Dashboard responded with HTTP 404 to a policy subcommand
    - name: policy_conflict_response
      type: bool
      direction: input
      description: whether the Dashboard responded with HTTP 409 to a policy subcommand
    - name: policy_exit_zero
      type: bool
      direction: output
      description: whether the policy subcommand terminated with exit code 0
    - name: policy_exit_bad_args
      type: bool
      direction: output
      description: whether the policy subcommand terminated with exit code 2 (ExitBadArgs)
    - name: policy_exit_not_found
      type: bool
      direction: output
      description: whether the policy subcommand terminated with exit code 3 (ExitNotFound)
    - name: policy_exit_conflict
      type: bool
      direction: output
      description: whether the policy subcommand terminated with exit code 4 (ExitConflict)
